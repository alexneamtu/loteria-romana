name: Generate Lottery Picks

on:
  schedule:
    # Generate picks: Sunday and Thursday at 6 AM UTC (8 AM EET / 9 AM EEST) - before draws
    - cron: '0 6 * * 0,4'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Budget in RON (optimally allocated across games)'
        required: false
        default: '70'
        type: string
      ev_gate:
        description: 'Enable EV/jackpot gate before generating picks'
        required: false
        default: 'true'
        type: string
      ev_min_ratio:
        description: 'Minimum jackpot/breakeven ratio when EV gate is enabled'
        required: false
        default: '0.80'
        type: string
      joker_jackpot:
        description: 'Current Joker jackpot (RON)'
        required: false
        default: ''
        type: string
      loto649_jackpot:
        description: 'Current Loto 6/49 jackpot (RON)'
        required: false
        default: ''
        type: string
      loto540_jackpot:
        description: 'Current Loto 5/40 jackpot (RON)'
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: history-writers
  cancel-in-progress: false

jobs:
  generate-picks:
    runs-on: ubuntu-24.04-arm
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Skip LSTM/TCN/Transformer/NF/RL — backtests show no measurable edge
      # and training dominates runtime.
      DISABLE_TORCH_STRATEGIES: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ML dependencies
        # torch and scikit-learn still imported elsewhere; pick the CPU-only
        # index for smaller wheels. Omitted on ARM64: the PyTorch cpu index
        # may not have aarch64 wheels on every release, so fall back to PyPI.
        run: pip install torch scikit-learn

      - name: Install DB driver
        run: pip install psycopg[binary]

      - name: Backfill latest historical draws
        run: PYTHONPATH=src python scripts/backfill_noroc_chior.py

      - name: Resolve budget
        id: config
        run: |
          budget="${{ github.event.inputs.budget }}"
          if [ -z "$budget" ] || ! [[ "$budget" =~ ^[0-9]+$ ]]; then
            budget="70"
          fi
          ev_gate="${{ github.event.inputs.ev_gate }}"
          # Default ON for scheduled runs (empty input). Manual dispatch can
          # still disable by passing 'false'.
          if [ -z "$ev_gate" ]; then
            ev_gate="true"
          fi
          if [ "$ev_gate" != "true" ]; then
            ev_gate="false"
          fi
          ev_min_ratio="${{ github.event.inputs.ev_min_ratio }}"
          if [ -z "$ev_min_ratio" ]; then
            ev_min_ratio="0.80"
          fi
          joker_jackpot="${{ github.event.inputs.joker_jackpot }}"
          loto649_jackpot="${{ github.event.inputs.loto649_jackpot }}"
          loto540_jackpot="${{ github.event.inputs.loto540_jackpot }}"
          echo "budget=$budget" >> "$GITHUB_OUTPUT"
          echo "ev_gate=$ev_gate" >> "$GITHUB_OUTPUT"
          echo "ev_min_ratio=$ev_min_ratio" >> "$GITHUB_OUTPUT"
          echo "joker_jackpot=$joker_jackpot" >> "$GITHUB_OUTPUT"
          echo "loto649_jackpot=$loto649_jackpot" >> "$GITHUB_OUTPUT"
          echo "loto540_jackpot=$loto540_jackpot" >> "$GITHUB_OUTPUT"

      - name: Generate recommended picks
        run: |
          cmd=(python scripts/generate_recommended_picks.py \
            --budget ${{ steps.config.outputs.budget }} \
            --seed ${{ github.run_id }} \
            --output-dir picks \
            --mixes 1 \
            --verbose)

          if [ "${{ steps.config.outputs.ev_gate }}" = "true" ]; then
            cmd+=(--ev-gate --ev-min-ratio "${{ steps.config.outputs.ev_min_ratio }}")

            if [ -n "${{ steps.config.outputs.joker_jackpot }}" ]; then
              cmd+=(--joker-jackpot "${{ steps.config.outputs.joker_jackpot }}")
            fi
            if [ -n "${{ steps.config.outputs.loto649_jackpot }}" ]; then
              cmd+=(--loto649-jackpot "${{ steps.config.outputs.loto649_jackpot }}")
            fi
            if [ -n "${{ steps.config.outputs.loto540_jackpot }}" ]; then
              cmd+=(--loto540-jackpot "${{ steps.config.outputs.loto540_jackpot }}")
            fi
          fi

          PYTHONPATH=src "${cmd[@]}"

      - name: Record picks date
        run: date +"%Y-%m-%d" > picks/date.txt

      - name: Upload picks artifact
        uses: actions/upload-artifact@v4
        with:
          name: picks-${{ github.run_id }}
          path: picks/
          retention-days: 7

      - name: Send picks to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          if [ ! -f picks/tickets.json ]; then
            if [ -f picks/skip_notice.txt ]; then
              MSG="$(cat picks/skip_notice.txt)"
            else
              MSG="🎰 Lottery Picks - ${DATE}: skipped (no tickets emitted)"
            fi
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" \
              -d parse_mode=Markdown > /dev/null
            exit 0
          fi

          PYTHONPATH=src python scripts/workflow_messages.py \
            --tickets-json picks/tickets.json \
            --date "${DATE}" \
            --format picks \
            | while IFS= read -r -d '' msg; do
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${msg}" \
                -d parse_mode=Markdown > /dev/null
            done

      - name: Commit budget ledger
        if: always()
        run: |
          if [ ! -f data/budget_bank.json ]; then
            echo "no ledger file; skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/budget_bank.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update budget ledger"
          git pull --rebase origin main
          git push
