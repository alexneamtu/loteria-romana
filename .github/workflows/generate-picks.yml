name: Generate Lottery Picks

on:
  schedule:
    # Generate picks: Sunday and Thursday at 10 AM UTC (12 PM EET) - before draws
    - cron: '0 10 * * 0,4'
  workflow_dispatch:
    inputs:
      joker_lines:
        description: 'Number of Joker lines to generate (8 RON each)'
        required: false
        default: '2'
        type: string
      loto649_lines:
        description: 'Number of Loto 6/49 lines to generate (6 RON each)'
        required: false
        default: '2'
        type: string
      loto540_lines:
        description: 'Number of Loto 5/40 lines to generate (4 RON each)'
        required: false
        default: '2'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  generate-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ML dependencies
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu scikit-learn

      - name: Backfill latest historical draws
        run: PYTHONPATH=src python scripts/backfill_noroc_chior.py

      - name: Prepare picks directory
        run: mkdir -p picks

      - name: Resolve line counts
        id: counts
        run: |
          normalize() {
            local input="$1"
            local fallback="$2"
            if [ -z "$input" ]; then
              echo "$fallback"
              return
            fi
            if ! [[ "$input" =~ ^[0-9]+$ ]]; then
              echo "$fallback"
              return
            fi
            echo "$input"
          }

          joker=$(normalize "${{ github.event.inputs.joker_lines }}" "2")
          loto649=$(normalize "${{ github.event.inputs.loto649_lines }}" "2")
          loto540=$(normalize "${{ github.event.inputs.loto540_lines }}" "2")

          echo "joker_lines=$joker" >> "$GITHUB_OUTPUT"
          echo "loto649_lines=$loto649" >> "$GITHUB_OUTPUT"
          echo "loto540_lines=$loto540" >> "$GITHUB_OUTPUT"

      - name: Generate picks for all strategies
        run: |
          STRATEGIES="blend bayesian cooccurrence genetic gradient_boost lstm tcn transformer normalizing_flow rl smart optimal coverage pattern ensemble"

          for strategy in $STRATEGIES; do
            echo "=== Generating picks with strategy: $strategy ==="

            if [ "${{ steps.counts.outputs.joker_lines }}" != "0" ]; then
              picks=$(PYTHONPATH=src python scripts/generate_joker_picks.py -s "$strategy" -n ${{ steps.counts.outputs.joker_lines }} --seed ${{ github.run_id }})
              printf '%s\n' "$picks" > "picks/joker_${strategy}.txt"
            fi

            if [ "${{ steps.counts.outputs.loto649_lines }}" != "0" ]; then
              picks=$(PYTHONPATH=src python scripts/generate_loto_649_picks.py -s "$strategy" -n ${{ steps.counts.outputs.loto649_lines }} --seed ${{ github.run_id }})
              printf '%s\n' "$picks" > "picks/loto649_${strategy}.txt"
            fi

            if [ "${{ steps.counts.outputs.loto540_lines }}" != "0" ]; then
              picks=$(PYTHONPATH=src python scripts/generate_loto_540_picks.py -s "$strategy" -n ${{ steps.counts.outputs.loto540_lines }} --seed ${{ github.run_id }})
              printf '%s\n' "$picks" > "picks/loto540_${strategy}.txt"
            fi
          done

          # Copy blend picks as the "played" picks for backward compatibility
          cp picks/joker_blend.txt picks/joker.txt 2>/dev/null || true
          cp picks/loto649_blend.txt picks/loto649.txt 2>/dev/null || true
          cp picks/loto540_blend.txt picks/loto540.txt 2>/dev/null || true

          echo "=== Generated picks summary ==="
          ls -la picks/

      - name: Record picks date
        run: date +"%Y-%m-%d" > picks/date.txt

      - name: Upload picks artifact
        uses: actions/upload-artifact@v4
        with:
          name: picks-${{ github.run_id }}
          path: picks/
          retention-days: 7

      - name: Send picks to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          STRATEGIES="blend bayesian cooccurrence genetic gradient_boost lstm tcn transformer normalizing_flow rl smart optimal coverage pattern ensemble"

          send_message() {
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="$1" \
              -d parse_mode="Markdown" > /dev/null
          }

          build_game_message() {
            local emoji="$1"
            local game_label="$2"
            local game_prefix="$3"
            local msg="${emoji} *${game_label} Picks - ${DATE}*"

            for strategy in $STRATEGIES; do
              local file="picks/${game_prefix}_${strategy}.txt"
              local content
              content=$(cat "$file" 2>/dev/null || true)
              if [ -n "$content" ]; then
                msg=$(printf '%s\n\n*%s*\n```\n%s\n```' "$msg" "$strategy" "$content")
              fi
            done

            echo "$msg"
          }

          # Send one message per game with all strategies labeled
          if [ "${{ steps.counts.outputs.loto540_lines }}" != "0" ]; then
            MSG=$(build_game_message "🎯" "LOTO 5/40" "loto540")
            send_message "$MSG"
          fi

          if [ "${{ steps.counts.outputs.loto649_lines }}" != "0" ]; then
            MSG=$(build_game_message "🎱" "LOTO 6/49" "loto649")
            send_message "$MSG"
          fi

          if [ "${{ steps.counts.outputs.joker_lines }}" != "0" ]; then
            MSG=$(build_game_message "🃏" "JOKER" "joker")
            send_message "$MSG"
          fi
