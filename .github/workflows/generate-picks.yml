name: Generate Lottery Picks

on:
  schedule:
    # Generate picks: Sunday and Thursday at 10 AM UTC (12 PM EET) - before draws
    - cron: '0 10 * * 0,4'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Budget in RON (optimally allocated across games)'
        required: false
        default: '40'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  generate-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ML dependencies
        run: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu scikit-learn

      - name: Backfill latest historical draws
        run: PYTHONPATH=src python scripts/backfill_noroc_chior.py

      - name: Resolve budget
        id: config
        run: |
          budget="${{ github.event.inputs.budget }}"
          if [ -z "$budget" ] || ! [[ "$budget" =~ ^[0-9]+$ ]]; then
            budget="40"
          fi
          echo "budget=$budget" >> "$GITHUB_OUTPUT"

      - name: Generate recommended picks
        run: |
          PYTHONPATH=src python scripts/generate_recommended_picks.py \
            --budget ${{ steps.config.outputs.budget }} \
            --seed ${{ github.run_id }} \
            --output-dir picks \
            --verbose

      - name: Record picks date
        run: date +"%Y-%m-%d" > picks/date.txt

      - name: Upload picks artifact
        uses: actions/upload-artifact@v4
        with:
          name: picks-${{ github.run_id }}
          path: picks/
          retention-days: 7

      - name: Send picks to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          BUDGET="${{ steps.config.outputs.budget }}"

          send_message() {
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="$1" \
              -d parse_mode="Markdown" > /dev/null
          }

          # Send Joker picks
          if [ -f "picks/joker.txt" ]; then
            JOKER_CONTENT=$(cat picks/joker.txt)
            MSG=$(printf '🃏 *JOKER Picks - %s*\nBudget: %s RON\n```\n%s\n```' "$DATE" "$BUDGET" "$JOKER_CONTENT")
            send_message "$MSG"
          fi

          # Send Loto 6/49 picks
          if [ -f "picks/loto649.txt" ]; then
            LOTO_CONTENT=$(cat picks/loto649.txt)
            MSG=$(printf '🎱 *LOTO 6/49 Picks - %s*\nBudget: %s RON\n```\n%s\n```' "$DATE" "$BUDGET" "$LOTO_CONTENT")
            send_message "$MSG"
          fi

          # Send Loto 5/40 picks
          if [ -f "picks/loto540.txt" ]; then
            LOTO540_CONTENT=$(cat picks/loto540.txt)
            MSG=$(printf '🎯 *LOTO 5/40 Picks - %s*\nBudget: %s RON\n```\n%s\n```' "$DATE" "$BUDGET" "$LOTO540_CONTENT")
            send_message "$MSG"
          fi
