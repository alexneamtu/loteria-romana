name: Generate Lottery Picks

on:
  schedule:
    # Generate picks: Sunday and Thursday at 10 AM UTC (12 PM EET) - before draws
    - cron: '0 10 * * 0,4'
  workflow_dispatch:
    inputs:
      joker_lines:
        description: 'Number of Joker lines to generate'
        required: false
        default: '7'
        type: string
      loto649_lines:
        description: 'Number of Loto 6/49 lines to generate'
        required: false
        default: '0'
        type: string
      loto540_lines:
        description: 'Number of Loto 5/40 lines to generate'
        required: false
        default: '0'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  generate-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backfill latest historical draws
        run: PYTHONPATH=src python scripts/backfill_noroc_chior.py

      - name: Prepare picks directory
        run: mkdir -p picks

      - name: Resolve line counts
        id: counts
        run: |
          normalize() {
            local input="$1"
            local fallback="$2"
            if [ -z "$input" ]; then
              echo "$fallback"
              return
            fi
            if ! [[ "$input" =~ ^[0-9]+$ ]]; then
              echo "$fallback"
              return
            fi
            echo "$input"
          }

          joker=$(normalize "${{ github.event.inputs.joker_lines }}" "7")
          loto649=$(normalize "${{ github.event.inputs.loto649_lines }}" "0")
          loto540=$(normalize "${{ github.event.inputs.loto540_lines }}" "0")

          echo "joker_lines=$joker" >> "$GITHUB_OUTPUT"
          echo "loto649_lines=$loto649" >> "$GITHUB_OUTPUT"
          echo "loto540_lines=$loto540" >> "$GITHUB_OUTPUT"

      - name: Generate Joker picks
        if: ${{ steps.counts.outputs.joker_lines != '0' }}
        run: |
          picks=$(PYTHONPATH=src python scripts/generate_joker_picks.py -s smart -n ${{ steps.counts.outputs.joker_lines }} --seed ${{ github.run_id }})
          printf '%s\n' "$picks" > picks/joker.txt

      - name: Generate Loto 6/49 picks
        if: ${{ steps.counts.outputs.loto649_lines != '0' }}
        run: |
          picks=$(PYTHONPATH=src python scripts/generate_loto_649_picks.py -s smart -n ${{ steps.counts.outputs.loto649_lines }} --seed ${{ github.run_id }})
          printf '%s\n' "$picks" > picks/loto649.txt

      - name: Generate Loto 5/40 picks
        if: ${{ steps.counts.outputs.loto540_lines != '0' }}
        run: |
          picks=$(PYTHONPATH=src python scripts/generate_loto_540_picks.py -s smart -n ${{ steps.counts.outputs.loto540_lines }} --seed ${{ github.run_id }})
          printf '%s\n' "$picks" > picks/loto540.txt

      - name: Record picks date
        run: date +"%Y-%m-%d" > picks/date.txt

      - name: Upload picks artifact
        uses: actions/upload-artifact@v4
        with:
          name: picks-${{ github.run_id }}
          path: picks/
          retention-days: 7

      - name: Send picks to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          MESSAGE="🎰 *Lottery Picks - ${DATE}*"
          has_picks=false

          append_section() {
            local label="$1"
            local file="$2"
            local content
            content=$(cat "$file" 2>/dev/null || true)
            if [ -n "$content" ]; then
              has_picks=true
              MESSAGE=$(printf '%s\n\n%s\n```\n%s\n```' "$MESSAGE" "$label" "$content")
            fi
          }

          append_section "🃏 *JOKER*" "picks/joker.txt"
          append_section "🎱 *LOTO 6/49*" "picks/loto649.txt"
          append_section "🎯 *LOTO 5/40*" "picks/loto540.txt"

          if [ "$has_picks" = false ]; then
            MESSAGE=$(printf '%s\n\n_No picks generated (all line counts set to 0)._' "$MESSAGE")
          fi

          MESSAGE=$(printf '%s\n\n_Generated with smart strategy_\n_Results will be checked tomorrow morning_' "$MESSAGE")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
