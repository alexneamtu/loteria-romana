name: Generate Lottery Picks

on:
  schedule:
    # Generate picks: Sunday and Thursday at 10 AM UTC (12 PM EET) - before draws
    - cron: '0 10 * * 0,4'
    # Check results: Monday and Friday at 6 AM UTC (8 AM EET) - morning after draws
    - cron: '0 6 * * 1,5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'generate'
        type: choice
        options:
          - generate
          - check_results

jobs:
  generate-picks:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'generate' || github.event_name == 'schedule' && github.event.schedule == '0 10 * * 0,4'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Joker picks
        id: joker
        run: |
          {
            echo 'PICKS<<EOF'
            PYTHONPATH=src python scripts/generate_joker_picks.py -s ensemble -n 3 --seed ${{ github.run_id }}
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Generate Loto 6/49 picks
        id: loto649
        run: |
          {
            echo 'PICKS<<EOF'
            PYTHONPATH=src python scripts/generate_loto_649_picks.py -s ensemble -n 3 --seed ${{ github.run_id }}
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Save picks for later comparison
        run: |
          mkdir -p picks
          echo "${{ steps.joker.outputs.PICKS }}" > picks/joker.txt
          echo "${{ steps.loto649.outputs.PICKS }}" > picks/loto649.txt
          date +"%Y-%m-%d" > picks/date.txt

      - name: Upload picks artifact
        uses: actions/upload-artifact@v4
        with:
          name: picks-${{ github.run_id }}
          path: picks/
          retention-days: 7

      - name: Send picks to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          MESSAGE="🎰 *Lottery Picks - ${DATE}*

          🃏 *JOKER*
          \`\`\`
          ${{ steps.joker.outputs.PICKS }}
          \`\`\`

          🎱 *LOTO 6/49*
          \`\`\`
          ${{ steps.loto649.outputs.PICKS }}
          \`\`\`

          _Generated with ensemble strategy_
          _Results will be checked tomorrow morning_"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"

  check-results:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'check_results' || github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1,5'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create results checker script
        run: |
          cat > check_results.py << 'SCRIPT'
          import sys
          import time
          sys.path.insert(0, 'src')

          from pathlib import Path
          from joker_model.fetch import update_dataset as update_joker
          from joker_model.storage import load_draws as load_joker
          from loto_649_model.fetch import update_dataset as update_loto649
          from loto_649_model.storage import load_draws as load_loto649
          import re
          from datetime import datetime, timedelta

          def parse_picks(text, game):
              """Parse picks from saved text format."""
              picks = []
              for line in text.strip().split('\n'):
                  if not line.strip():
                      continue
                  match = re.match(r'\d+\.\s*([\d,\s]+)', line)
                  if match:
                      numbers = [int(n.strip()) for n in match.group(1).split(',')]
                      picks.append(numbers)
              return picks

          def check_matches(picks, winning_numbers):
              """Check how many numbers match."""
              results = []
              for pick in picks:
                  matched = set(pick) & set(winning_numbers)
                  results.append({
                      'pick': pick,
                      'matched': sorted(matched),
                      'count': len(matched)
                  })
              return results

          def format_result(pick, matched, count, total):
              """Format a single result line."""
              pick_str = ', '.join(str(n) for n in pick)
              if count == 0:
                  return f"❌ {pick_str} - no matches"
              elif count <= 2:
                  matched_str = ', '.join(str(n) for n in matched)
                  return f"🔸 {pick_str} - {count}/{total} matched: [{matched_str}]"
              else:
                  matched_str = ', '.join(str(n) for n in matched)
                  return f"✅ {pick_str} - {count}/{total} matched: [{matched_str}]"

          def fetch_results_with_retry(max_retries=5, delay_minutes=10):
              """Fetch results with retry logic."""
              joker_cache = Path("data/raw/joker_results.html")
              joker_csv = Path("data/clean/joker_draws.csv")
              loto_cache = Path("data/raw/loto_649_results.html")
              loto_csv = Path("data/clean/loto_649_draws.csv")

              joker_cache.parent.mkdir(parents=True, exist_ok=True)
              joker_csv.parent.mkdir(parents=True, exist_ok=True)

              # Get yesterday's date (draw date)
              yesterday = (datetime.now() - timedelta(days=1)).strftime("%Y-%m-%d")

              for attempt in range(max_retries):
                  print(f"Attempt {attempt + 1}/{max_retries}: Fetching results...")

                  # Clear cache to force fresh fetch
                  if joker_cache.exists():
                      joker_cache.unlink()
                  if loto_cache.exists():
                      loto_cache.unlink()

                  try:
                      update_joker(
                          "https://www.loto.ro/loto-new/newLotoSiteNexioFinalVersion/web/app2.php/jocuri/joker_si_noroc_plus/rezultate_extrageri.html",
                          joker_cache, joker_csv
                      )
                      update_loto649(
                          "https://www.loto.ro/loto-new/newLotoSiteNexioFinalVersion/web/app2.php/jocuri/649_si_noroc/rezultate_extragere.html",
                          loto_cache, loto_csv
                      )
                  except Exception as e:
                      print(f"Fetch error: {e}")
                      if attempt < max_retries - 1:
                          print(f"Waiting {delay_minutes} minutes before retry...")
                          time.sleep(delay_minutes * 60)
                          continue
                      raise

                  # Load and check if we have recent results
                  joker_draws = load_joker(joker_csv)
                  loto_draws = load_loto649(loto_csv)

                  joker_ok = joker_draws and str(joker_draws[-1].date) >= yesterday
                  loto_ok = loto_draws and str(loto_draws[-1].date) >= yesterday

                  if joker_ok or loto_ok:
                      print(f"Results found!")
                      return joker_draws, loto_draws

                  if attempt < max_retries - 1:
                      print(f"Results not yet available. Waiting {delay_minutes} minutes...")
                      time.sleep(delay_minutes * 60)

              print("Warning: Could not find recent results after all retries")
              return load_joker(joker_csv), load_loto649(loto_csv)

          # Fetch with retries
          joker_draws, loto_draws = fetch_results_with_retry(max_retries=5, delay_minutes=10)

          if not joker_draws:
              print("JOKER_WINNING=No results available")
              print("JOKER_RESULTS=Could not fetch Joker results")
          else:
              latest_joker = joker_draws[-1]
              print(f"JOKER_WINNING={', '.join(str(n) for n in latest_joker.main_numbers)} + J{latest_joker.joker}")

          if not loto_draws:
              print("LOTO_WINNING=No results available")
              print("LOTO_RESULTS=Could not fetch Loto 6/49 results")
          else:
              latest_loto = loto_draws[-1]
              noroc_str = f" + N{latest_loto.noroc}" if latest_loto.noroc else ""
              print(f"LOTO_WINNING={', '.join(str(n) for n in latest_loto.main_numbers)}{noroc_str}")

          # Read saved picks
          joker_picks_file = Path("picks/joker.txt")
          loto_picks_file = Path("picks/loto649.txt")

          if joker_picks_file.exists() and joker_draws:
              joker_picks = parse_picks(joker_picks_file.read_text(), 'joker')
              joker_results = check_matches(joker_picks, joker_draws[-1].main_numbers)

              output_lines = []
              for r in joker_results:
                  output_lines.append(format_result(r['pick'], r['matched'], r['count'], 5))
              print("JOKER_RESULTS=" + "\\n".join(output_lines))
          else:
              print("JOKER_RESULTS=No picks found to compare")

          if loto_picks_file.exists() and loto_draws:
              loto_picks = parse_picks(loto_picks_file.read_text(), 'loto649')
              loto_results = check_matches(loto_picks, loto_draws[-1].main_numbers)

              output_lines = []
              for r in loto_results:
                  output_lines.append(format_result(r['pick'], r['matched'], r['count'], 6))
              print("LOTO_RESULTS=" + "\\n".join(output_lines))
          else:
              print("LOTO_RESULTS=No picks found to compare")
          SCRIPT

      - name: Download latest picks artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: generate-picks.yml
          name: picks-.*
          name_is_regexp: true
          path: picks
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Move picks files
        run: |
          if [ -d "picks/picks-"* ]; then
            mv picks/picks-*/* picks/ 2>/dev/null || true
          fi
          ls -la picks/ || echo "No picks directory"

      - name: Check results (with retries)
        id: results
        timeout-minutes: 60
        run: |
          output=$(PYTHONPATH=src python check_results.py 2>&1)
          echo "$output"

          # Parse output
          JOKER_WINNING=$(echo "$output" | grep "^JOKER_WINNING=" | cut -d= -f2-)
          LOTO_WINNING=$(echo "$output" | grep "^LOTO_WINNING=" | cut -d= -f2-)
          JOKER_RESULTS=$(echo "$output" | grep "^JOKER_RESULTS=" | cut -d= -f2- | sed 's/\\n/\n/g')
          LOTO_RESULTS=$(echo "$output" | grep "^LOTO_RESULTS=" | cut -d= -f2- | sed 's/\\n/\n/g')

          echo "JOKER_WINNING=${JOKER_WINNING}" >> $GITHUB_OUTPUT
          echo "LOTO_WINNING=${LOTO_WINNING}" >> $GITHUB_OUTPUT

          {
            echo 'JOKER_RESULTS<<EOF'
            echo "${JOKER_RESULTS}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          {
            echo 'LOTO_RESULTS<<EOF'
            echo "${LOTO_RESULTS}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Send results to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date -d "yesterday" +"%Y-%m-%d" 2>/dev/null || date -v-1d +"%Y-%m-%d")
          MESSAGE="🎲 *Draw Results - ${DATE}*

          🃏 *JOKER*
          Winning: ${{ steps.results.outputs.JOKER_WINNING }}

          Your picks:
          ${{ steps.results.outputs.JOKER_RESULTS }}

          🎱 *LOTO 6/49*
          Winning: ${{ steps.results.outputs.LOTO_WINNING }}

          Your picks:
          ${{ steps.results.outputs.LOTO_RESULTS }}

          _Better luck next time! 🍀_"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
