name: Generate Lottery Picks

on:
  schedule:
    # Generate picks: Sunday and Thursday at 10 AM UTC (12 PM EET) - before draws
    - cron: '0 10 * * 0,4'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  generate-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Joker picks
        id: joker
        run: |
          {
            echo 'PICKS<<EOF'
            PYTHONPATH=src python scripts/generate_joker_picks.py -s ensemble -n 3 --seed ${{ github.run_id }}
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Generate Loto 6/49 picks
        id: loto649
        run: |
          {
            echo 'PICKS<<EOF'
            PYTHONPATH=src python scripts/generate_loto_649_picks.py -s ensemble -n 3 --seed ${{ github.run_id }}
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Generate Loto 5/40 picks
        id: loto540
        run: |
          {
            echo 'PICKS<<EOF'
            PYTHONPATH=src python scripts/generate_loto_540_picks.py -s ensemble -n 3 --seed ${{ github.run_id }}
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Save picks for later comparison
        run: |
          mkdir -p picks
          echo "${{ steps.joker.outputs.PICKS }}" > picks/joker.txt
          echo "${{ steps.loto649.outputs.PICKS }}" > picks/loto649.txt
          echo "${{ steps.loto540.outputs.PICKS }}" > picks/loto540.txt
          date +"%Y-%m-%d" > picks/date.txt

      - name: Upload picks artifact
        uses: actions/upload-artifact@v4
        with:
          name: picks-${{ github.run_id }}
          path: picks/
          retention-days: 7

      - name: Send picks to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          MESSAGE="🎰 *Lottery Picks - ${DATE}*

          🃏 *JOKER*
          \`\`\`
          ${{ steps.joker.outputs.PICKS }}
          \`\`\`

          🎱 *LOTO 6/49*
          \`\`\`
          ${{ steps.loto649.outputs.PICKS }}
          \`\`\`

          🎯 *LOTO 5/40*
          \`\`\`
          ${{ steps.loto540.outputs.PICKS }}
          \`\`\`

          _Generated with ensemble strategy_
          _Results will be checked tomorrow morning_"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
