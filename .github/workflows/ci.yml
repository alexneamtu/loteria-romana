name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pytest pytest-xdist torch --extra-index-url https://download.pytorch.org/whl/cpu scikit-learn

      - name: Run tests
        # -n auto spreads tests across all available CPU cores (4 on
        # ubuntu-latest runners).
        #
        # SLOW_TESTS stays off here on purpose. Those tests subprocess the
        # real orchestrator, train sklearn strategies and scrape live
        # jackpots from loto.ro — enabling them took this job from ~5min to
        # >20min and puts a third-party site on the PR critical path. The
        # EV-gate logic is covered by fast mocked tests instead.
        run: PYTHONPATH=src python -m pytest tests/ -v -n auto --dist=loadfile
