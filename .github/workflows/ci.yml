name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pytest pytest-xdist torch --extra-index-url https://download.pytorch.org/whl/cpu scikit-learn

      - name: Run tests
        # -n auto spreads tests across all available CPU cores (4 on
        # ubuntu-latest runners).
        run: PYTHONPATH=src python -m pytest tests/ -v -n auto --dist=loadfile
