name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pytest pytest-xdist torch --extra-index-url https://download.pytorch.org/whl/cpu scikit-learn

      - name: Run tests
        # -n auto spreads tests across all available CPU cores (4 on
        # ubuntu-latest runners). SLOW_TESTS=1 adds the ensemble_blend
        # pipeline and the generate_recommended_picks orchestrator tests —
        # i.e. the code the scheduled workflow actually runs — for ~30s.
        env:
          SLOW_TESTS: '1'
        run: PYTHONPATH=src python -m pytest tests/ -v -n auto --dist=loadfile
