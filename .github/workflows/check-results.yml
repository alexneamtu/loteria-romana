name: Check Lottery Results

on:
  schedule:
    # Check results: Monday and Friday at 6 AM UTC (8 AM EET) - morning after draws
    - cron: '0 6 * * 1,5'
  workflow_dispatch:
    inputs:
      max_retries:
        description: 'Max retries for results check (default: 5)'
        required: false
        default: '5'
        type: string
      retry_delay:
        description: 'Delay between retries in minutes (default: 10)'
        required: false
        default: '10'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  check-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download latest picks artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: generate-picks.yml
          name: picks-.*
          name_is_regexp: true
          path: picks
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Move picks files
        run: |
          if [ -d "picks/picks-"* ]; then
            mv picks/picks-*/* picks/ 2>/dev/null || true
          fi
          ls -la picks/ || echo "No picks directory"

      - name: Check results (with retries)
        id: results
        timeout-minutes: 60
        env:
          MAX_RETRIES: ${{ github.event.inputs.max_retries || '5' }}
          RETRY_DELAY_MINUTES: ${{ github.event.inputs.retry_delay || '10' }}
        run: |
          output=$(python scripts/check_results.py 2>&1)
          echo "$output"

          # Parse output
          JOKER_DATE=$(echo "$output" | grep "^JOKER_DATE=" | cut -d= -f2-)
          JOKER_WINNING=$(echo "$output" | grep "^JOKER_WINNING=" | cut -d= -f2-)
          LOTO_DATE=$(echo "$output" | grep "^LOTO_DATE=" | cut -d= -f2-)
          LOTO_WINNING=$(echo "$output" | grep "^LOTO_WINNING=" | cut -d= -f2-)
          LOTO540_DATE=$(echo "$output" | grep "^LOTO540_DATE=" | cut -d= -f2-)
          LOTO540_WINNING=$(echo "$output" | grep "^LOTO540_WINNING=" | cut -d= -f2-)
          JOKER_RESULTS=$(echo "$output" | grep "^JOKER_RESULTS=" | cut -d= -f2- | sed 's/\\n/\n/g')
          LOTO_RESULTS=$(echo "$output" | grep "^LOTO_RESULTS=" | cut -d= -f2- | sed 's/\\n/\n/g')
          LOTO540_RESULTS=$(echo "$output" | grep "^LOTO540_RESULTS=" | cut -d= -f2- | sed 's/\\n/\n/g')
          JOKER_COMPARISON=$(echo "$output" | grep "^JOKER_COMPARISON=" | cut -d= -f2- | sed 's/\\n/\n/g')
          LOTO_COMPARISON=$(echo "$output" | grep "^LOTO_COMPARISON=" | cut -d= -f2- | sed 's/\\n/\n/g')
          LOTO540_COMPARISON=$(echo "$output" | grep "^LOTO540_COMPARISON=" | cut -d= -f2- | sed 's/\\n/\n/g')

          echo "JOKER_DATE=${JOKER_DATE}" >> $GITHUB_OUTPUT
          echo "JOKER_WINNING=${JOKER_WINNING}" >> $GITHUB_OUTPUT
          echo "LOTO_DATE=${LOTO_DATE}" >> $GITHUB_OUTPUT
          echo "LOTO_WINNING=${LOTO_WINNING}" >> $GITHUB_OUTPUT
          echo "LOTO540_DATE=${LOTO540_DATE}" >> $GITHUB_OUTPUT
          echo "LOTO540_WINNING=${LOTO540_WINNING}" >> $GITHUB_OUTPUT

          {
            echo 'JOKER_RESULTS<<EOF'
            echo "${JOKER_RESULTS}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          {
            echo 'LOTO_RESULTS<<EOF'
            echo "${LOTO_RESULTS}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          {
            echo 'LOTO540_RESULTS<<EOF'
            echo "${LOTO540_RESULTS}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          {
            echo 'JOKER_COMPARISON<<EOF'
            echo "${JOKER_COMPARISON}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          {
            echo 'LOTO_COMPARISON<<EOF'
            echo "${LOTO_COMPARISON}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          {
            echo 'LOTO540_COMPARISON<<EOF'
            echo "${LOTO540_COMPARISON}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Send results to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🎲 *Draw Results*

          🃏 *JOKER* (${{ steps.results.outputs.JOKER_DATE }})
          Winning: ${{ steps.results.outputs.JOKER_WINNING }}

          Played (blend):
          ${{ steps.results.outputs.JOKER_RESULTS }}

          🎱 *LOTO 6/49* (${{ steps.results.outputs.LOTO_DATE }})
          Winning: ${{ steps.results.outputs.LOTO_WINNING }}

          Played (blend):
          ${{ steps.results.outputs.LOTO_RESULTS }}

          🎯 *LOTO 5/40* (${{ steps.results.outputs.LOTO540_DATE }})
          Winning: ${{ steps.results.outputs.LOTO540_WINNING }}

          Played (blend):
          ${{ steps.results.outputs.LOTO540_RESULTS }}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"

      - name: Send strategy comparison to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMPARISON="📊 *Strategy Comparison*

          🃏 *JOKER*
          \`\`\`
          ${{ steps.results.outputs.JOKER_COMPARISON }}
          \`\`\`

          🎱 *LOTO 6/49*
          \`\`\`
          ${{ steps.results.outputs.LOTO_COMPARISON }}
          \`\`\`

          🎯 *LOTO 5/40*
          \`\`\`
          ${{ steps.results.outputs.LOTO540_COMPARISON }}
          \`\`\`

          _Ranked by total matches across all lines_"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${COMPARISON}" \
            -d parse_mode="Markdown"
