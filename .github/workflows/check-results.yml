name: Check Lottery Results

on:
  schedule:
    # Check results: Monday and Friday at 4 AM UTC (6 AM EET / 7 AM EEST) - morning after draws
    - cron: '0 4 * * 1,5'
  workflow_dispatch:
    inputs:
      max_retries:
        description: 'Max retries for results check (default: 1; side games typically not published in time)'
        required: false
        default: '1'
        type: string
      retry_delay:
        description: 'Delay between retries in minutes (default: 1)'
        required: false
        default: '1'
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: history-writers
  cancel-in-progress: false

jobs:
  check-results:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install DB driver
        run: pip install psycopg[binary]

      - name: Download latest picks artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: generate-picks.yml
          name: picks-.*
          name_is_regexp: true
          path: picks
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Move picks files
        run: |
          # Retention is 7 days and generate runs twice a week, so two
          # artifact dirs is the normal case — `[ -d picks/picks-* ]` then
          # expands to two words and the test errors out, silently skipping
          # the move and leaving check_results.py with nothing to score.
          for d in picks/picks-*/; do
            [ -d "$d" ] && mv "$d"* picks/ 2>/dev/null || true
          done
          echo "=== Picks files ==="
          ls -la picks/ || echo "No picks directory"

      - name: Check results
        timeout-minutes: 20
        env:
          MAX_RETRIES: ${{ github.event.inputs.max_retries || '1' }}
          RETRY_DELAY_MINUTES: ${{ github.event.inputs.retry_delay || '1' }}
        run: python scripts/check_results.py

      - name: Send results to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for file in results/loto540.txt results/loto649.txt results/joker.txt; do
            if [ -f "$file" ]; then
              msg="$(cat "$file")"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${msg}" \
                -d parse_mode=Markdown > /dev/null
            fi
          done

          if [ -f "results/comparison.txt" ]; then
            msg="$(cat results/comparison.txt)"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${msg}" \
              -d parse_mode=Markdown > /dev/null
          fi

      - name: Commit results history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results/history.csv data/results/picks_detail.jsonl
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update results history"
          git pull --rebase --autostash origin main
          git push
