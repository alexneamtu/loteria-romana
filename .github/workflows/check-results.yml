name: Check Lottery Results

on:
  schedule:
    # Check results: Monday and Friday at 9 AM UTC (11 AM EET) - morning after draws
    - cron: '0 9 * * 1,5'
  workflow_dispatch:
    inputs:
      max_retries:
        description: 'Max retries for results check (default: 3)'
        required: false
        default: '3'
        type: string
      retry_delay:
        description: 'Delay between retries in minutes (default: 5)'
        required: false
        default: '5'
        type: string

permissions:
  actions: read
  contents: write

jobs:
  check-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download latest picks artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: generate-picks.yml
          name: picks-.*
          name_is_regexp: true
          path: picks
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Move picks files
        run: |
          if [ -d "picks/picks-"* ]; then
            mv picks/picks-*/* picks/ 2>/dev/null || true
          fi
          echo "=== Picks files ==="
          ls -la picks/ || echo "No picks directory"

      - name: Check results
        timeout-minutes: 20
        env:
          MAX_RETRIES: ${{ github.event.inputs.max_retries || '3' }}
          RETRY_DELAY_MINUTES: ${{ github.event.inputs.retry_delay || '5' }}
        run: python scripts/check_results.py

      - name: Send results to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          send_message() {
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="$1" \
              -d parse_mode="Markdown" > /dev/null
          }

          # Send per-game results (one message each)
          for file in results/loto540.txt results/loto649.txt results/joker.txt; do
            if [ -f "$file" ]; then
              send_message "$(cat "$file")"
            fi
          done

          # Send strategy ranking summary
          if [ -f "results/comparison.txt" ]; then
            send_message "$(cat results/comparison.txt)"
          fi

      - name: Commit results history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results/history.csv
          git diff --staged --quiet || git commit -m "chore: update results history"
          git push
